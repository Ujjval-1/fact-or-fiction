<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111218">
  <title>Fact or Fiction</title>
  <style>
    :root{color-scheme:dark;--bg:#111218;--panel:#1a1b25;--panel2:#222431;--ink:#f7f4ed;--muted:#b4b3c0;--line:#41414f;--lime:#cdf278;--pink:#ff8fa2;--blue:#9fa9ff;--amber:#ffbd72;--amber-glow:#ff8e4530}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#39344e 0,transparent 46%),var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit}button{cursor:pointer}.wrap{width:min(760px,100%);margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom));min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{font-weight:850;letter-spacing:-.05em;font-size:19px}.brand i{font-style:normal;color:var(--lime)}.connection{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#656673}.dot.on{background:var(--lime);box-shadow:0 0 10px #cdf27877}.dot.off{background:var(--pink)}
    .card{background:linear-gradient(150deg,#22232f,#191a23);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,34px);box-shadow:0 22px 75px #0005}.center{text-align:center}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--lime);font-size:11px;font-weight:850}.title{font-size:clamp(32px,8vw,54px);line-height:1.04;letter-spacing:-.055em;margin:12px 0}.sub{color:var(--muted);max-width:510px;margin:8px auto 24px}.row{display:flex;gap:10px}.stack{display:grid;gap:14px}.field{width:100%;color:var(--ink);background:#111219;border:1px solid #50505d;border-radius:12px;padding:14px 15px;outline:none}.field:focus{border-color:var(--lime);box-shadow:0 0 0 3px #cdf27820}.field.code{text-transform:uppercase;letter-spacing:.12em}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:var(--lime);color:#161812;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn:disabled{opacity:.46;cursor:not-allowed;transform:none}.btn.secondary{background:#2c2e3b;color:var(--ink);border:1px solid #50515e}.btn.small{padding:9px 13px;font-size:13px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.join{margin-top:14px}.error{min-height:22px;color:var(--pink);font-size:13px;margin:12px 0 0}.fine{color:var(--muted);font-size:12px;margin-top:20px}.rules-line{color:#e4e0d6;background:#252530;border:1px solid #424250;border-radius:12px;padding:10px 13px;margin:0 auto 20px;max-width:510px;font-size:14px}.rules-line strong{color:var(--lime)}
    .room-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.room-code{border:1px dashed #77757f;background:#20212c;border-radius:15px;padding:12px 18px;color:var(--lime);letter-spacing:.24em;font-weight:950;font-size:clamp(30px,8vw,48px);line-height:1;text-shadow:0 0 24px #cdf27830;white-space:nowrap}.players{display:grid;gap:9px;margin:20px 0}.player{padding:12px 14px;background:#20212a;border:1px solid #393a46;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.player-main{display:flex;align-items:center;gap:10px}.avatar{width:31px;height:31px;display:grid;place-items:center;background:#303143;color:var(--blue);border-radius:10px;font-weight:850}.status{color:var(--muted);font-size:12px}.pill{border-radius:999px;background:#2c2e3b;color:#e2e1e9;padding:5px 10px;font-size:12px;white-space:nowrap}.phase-meta{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;color:var(--muted);font-size:13px}.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:850;color:var(--lime)}.question{font-size:clamp(23px,5.5vw,35px);letter-spacing:-.03em;line-height:1.2;margin:13px 0 23px}.input-answer{font-size:17px}.hint{color:var(--muted);font-size:13px;margin:10px 0 18px}.choice-list{display:grid;gap:10px}.choice{width:100%;min-height:58px;text-align:left;background:#20212b;border:1px solid #484957;color:var(--ink);border-radius:14px;padding:16px 17px;display:flex;gap:13px;align-items:center;transition:.15s}.choice:hover{border-color:#a0a0ad;background:#272936}.choice.selected{border-color:var(--lime);box-shadow:0 0 0 2px #cdf27830}.choice:disabled{opacity:.72;cursor:default}.letter{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:#323442;color:#e4e3ed;font-size:13px;font-weight:850}.choice.selected .letter{background:var(--lime);color:#171912}.choice-text{font-weight:650}.answers-grid{display:grid;gap:10px}.answer-card{padding:15px;background:#21222d;border-radius:13px;border:1px solid #41424f}.answer-card.real{border-color:var(--amber);background:linear-gradient(145deg,#39291f,#28221f);box-shadow:inset 0 0 30px var(--amber-glow),0 0 26px #ffad5520}.answer-line{font-weight:750;font-size:17px}.answer-tag{font-size:11px;color:var(--amber);font-weight:900;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.answer-meta{color:var(--muted);font-size:12px;margin-top:7px}.truth-callout{background:#252a1e;border:1px solid #61783c;border-radius:12px;padding:12px 14px;margin:14px 0;color:#e4f7ba}.board{display:grid;gap:8px;margin:18px 0}.board-row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;background:#20212b;padding:13px 15px;border-radius:12px}.rank{color:var(--lime);font-weight:900}.score{font-weight:900;font-size:19px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#34313c;border:1px solid #66616f;color:var(--ink);padding:11px 15px;border-radius:12px;box-shadow:0 8px 28px #0006;max-width:calc(100% - 30px);z-index:5}.hidden{display:none!important}.progress{height:5px;background:#30313c;border-radius:99px;overflow:hidden;margin:0 0 22px}.progress span{display:block;height:100%;background:var(--lime);width:100%;transform-origin:left;transition:width .4s linear}
    .reveal .card{border-color:#76543c;background:radial-gradient(ellipse at 50% 0,#5a382b66,transparent 52%),linear-gradient(150deg,#28232b,#1c1a21)}.reveal .question{color:var(--amber);text-shadow:0 0 26px #ffb05b35}.reveal .phase-meta:first-child{color:#e8b98b}
    @media(min-width:650px){.players{grid-template-columns:1fr 1fr}.answers-grid{grid-template-columns:1fr 1fr}.wrap{padding-top:32px}}@media(max-width:430px){.wrap{padding:13px 13px calc(22px + env(safe-area-inset-bottom))}.top{margin-bottom:15px}.room-head{align-items:flex-start}.row{flex-direction:column}.row .btn{width:100%}.card{border-radius:18px;padding:19px 16px}.phase-meta{font-size:12px;margin-bottom:11px}.progress{margin-bottom:15px}.question{font-size:clamp(21px,6vw,27px);line-height:1.14;margin:9px 0 15px}.choice{min-height:64px;padding:17px;font-size:16px}.room-code{font-size:clamp(31px,10vw,42px);padding:13px 15px}.room-head .title{font-size:30px!important}.rules-line{font-size:13px;padding:9px 10px}.hint{line-height:1.35}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand">FACT <i>OR</i> FICTION</div><div class="connection"><span id="dot" class="dot"></span><span id="connectionText">Connecting…</span></div></header>
  <section id="screen"></section>
</main>
<div id="toast" class="toast hidden"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const screen = $('#screen'), dot = $('#dot'), connectionText = $('#connectionText'), toast = $('#toast');
  const stored = (() => { try { return JSON.parse(localStorage.getItem('fof-player') || '{}'); } catch { return {}; } })();
  let ws, connected = false, state = null, chosen = null, toastTimer, lastPhase = '';
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);
    ws.onopen = () => { connected = true; dot.className = 'dot on'; connectionText.textContent = 'Connected';
      if (stored.roomCode && stored.token) { renderJoin(); send({type:'join', roomCode:stored.roomCode, token:stored.token, name:stored.name || ''}); } else renderJoin(); };
    ws.onclose = () => { connected = false; dot.className = 'dot off'; connectionText.textContent = 'Reconnecting…'; setTimeout(connect, 1200); };
    ws.onerror = () => ws.close();
    ws.onmessage = e => { const msg = JSON.parse(e.data); if (msg.type === 'joined') { stored.roomCode = msg.roomCode; stored.token = msg.token; localStorage.setItem('fof-player', JSON.stringify(stored)); }
      if (msg.type === 'state') { state = msg.state; if (state.phase !== lastPhase) { chosen = null; lastPhase = state.phase; } render(); }
      if (msg.type === 'error' && !state) { stored.roomCode = null; stored.token = null; localStorage.setItem('fof-player', JSON.stringify(stored)); renderJoin(); showToast(msg.message); }
      else if (msg.type === 'error' || msg.type === 'notice') showToast(msg.message); };
  }
  function send(data) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data)); }
  function showToast(message) { toast.textContent = message; toast.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.add('hidden'), 2800); }
  function renderJoin() { state = null; screen.innerHTML = `<section class="card center"><div class="eyebrow">A party game for clever bluffers</div><h1 class="title">Fact or<br>Fiction?</h1><p class="sub">One strange question. One real answer. Can your friends tell truth from a convincing lie?</p><p class="rules-line"><strong>Make up a believable answer.</strong> Spot the truth—or fool the room.</p><div class="stack"><input id="name" class="field" maxlength="18" placeholder="Your name" autocomplete="nickname"><div class="row"><button id="create" class="btn">Create a room</button><input id="room" class="field code" maxlength="5" placeholder="ROOM CODE" autocomplete="off"><button id="join" class="btn secondary">Join room</button></div></div><p id="error" class="error"></p><div class="fine">2–8 players · 5 rounds · No account needed</div></section>`;
    $('#create').onclick = () => { const name = $('#name').value.trim(); if (!name) return showToast('Enter your name first.'); stored.name = name; localStorage.setItem('fof-player', JSON.stringify(stored)); send({type:'create',name}); };
    $('#join').onclick = () => { const name=$('#name').value.trim(), roomCode=$('#room').value.trim().toUpperCase(); if (!name || !roomCode) return showToast('Enter your name and room code.'); stored.name=name; localStorage.setItem('fof-player',JSON.stringify(stored)); send({type:'join',name,roomCode}); };
  }
  function playerRows() { return state.players.map((p,i)=>`<div class="player"><div class="player-main"><div class="avatar">${escapeHtml(p.name.slice(0,1).toUpperCase())}</div><div><strong>${escapeHtml(p.name)}${p.id===state.hostId?' <span style="color:var(--lime)">· HOST</span>':''}</strong><div class="status">${p.connected?'Ready to play':'Reconnecting…'}</div></div></div>${state.phase!=='lobby'?`<span class="pill">${p.score} pts</span>`:''}</div>`).join(''); }
  function phaseTop(label) { const seconds = state.endsAt ? Math.max(0,Math.ceil((state.endsAt-Date.now())/1000)) : 0; return `<div class="phase-meta"><span>${label}</span><span class="timer">${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}</span></div><div class="progress"><span style="width:${Math.max(0,Math.min(100,seconds/(label==='WRITE YOUR BLUFF'?60:label==='MAKE YOUR PICK'?30:15)*100))}%"></span></div>`; }
  function renderLobby() { screen.innerHTML = `<div class="room-head"><div><div class="eyebrow">Game room</div><h1 class="title" style="font-size:38px;margin:5px 0 0">Waiting room</h1></div><div style="text-align:right"><div class="status">ROOM CODE</div><div class="room-code">${state.roomCode}</div></div></div><section class="card"><div class="phase-meta"><span>${state.players.length} / 8 PLAYERS</span><span class="pill">5 rounds · 60 sec to write</span></div><div class="players">${playerRows()}</div><div class="center">${state.isHost?`<button id="start" class="btn" ${state.canStart?'':'disabled'}>Start game</button><p class="hint">${state.canStart?'Get everyone ready, then start.':'Invite at least one more player.'}</p>`:`<p class="hint">Waiting for the host to start…</p>`}</div></section>`; const b=$('#start'); if(b)b.onclick=()=>send({type:'start'}); }
  function renderWriting() { screen.innerHTML = `<section class="card">${phaseTop('WRITE YOUR BLUFF')}<div class="eyebrow">Round ${state.round} of ${state.totalRounds}</div><h1 class="question">${escapeHtml(state.question)}</h1>${state.youSubmitted?`<div class="truth-callout">Your answer is locked in. Waiting for everyone else…</div><p class="hint">${state.submitted} of ${state.players.length} players have submitted.</p>`:`<label class="hint" for="answer">Make up a plausible answer. Your answer stays secret until the reveal.</label><form id="answerForm" class="stack"><input id="answer" class="field input-answer" maxlength="100" placeholder="Type your answer…" autocomplete="off" required><button class="btn">Lock in answer</button></form><p class="hint">If you write the exact real answer, you’ll earn 3 points and sit out the vote.</p>`}</section><section style="margin-top:14px"><div class="phase-meta"><span>PLAYERS</span><span>${state.submitted} / ${state.players.length} answered</span></div><div class="players">${playerRows()}</div></section>`;
    const form=$('#answerForm'); if(form)form.onsubmit=e=>{e.preventDefault();send({type:'submit',answer:$('#answer').value});}; }
  function renderVoting() { const letters='ABCDEFGH'; const choices=state.choices.map((c,i)=>`<button class="choice ${chosen===c.id?'selected':''}" data-choice="${c.id}" ${!state.eligible||state.ownChoiceIds.includes(c.id)?'disabled':''}><span class="letter">${letters[i]||'•'}</span><span class="choice-text">${escapeHtml(c.text)}${state.ownChoiceIds.includes(c.id)?' <span class="status">(your answer)</span>':''}</span></button>`).join('');
    screen.innerHTML = `<section class="card">${phaseTop('MAKE YOUR PICK')}<div class="eyebrow">Round ${state.round} of ${state.totalRounds}</div><h1 class="question">${escapeHtml(state.question)}</h1>${state.truthAlreadyFound?`<div class="truth-callout">You wrote the real answer! <strong>+3 points</strong> · You sit out this vote.</div>`:state.youVoted?`<div class="truth-callout">Vote locked in. Waiting for the others…</div>`:`<p class="hint">Which answer is real? You can’t vote for your own bluff.</p>`}<div class="choice-list">${choices}</div><p class="hint">${state.voted} of ${state.players.length} votes in</p></section><section style="margin-top:14px"><div class="phase-meta"><span>PLAYERS</span><span>+3 find truth · +2 for each bluff vote</span></div><div class="players">${playerRows()}</div></section>`;
    screen.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(!state.eligible||state.youVoted)return;chosen=b.dataset.choice;screen.querySelectorAll('[data-choice]').forEach(x=>x.classList.toggle('selected',x===b));send({type:'vote',choiceId:chosen});}); }
  function renderReveal() { const answerCards=state.choices.map(c=>`<div class="answer-card ${c.real?'real':''}">${c.real?'<div class="answer-tag">The real answer</div>':''}<div class="answer-line">${escapeHtml(c.text)}</div><div class="answer-meta">${c.real?'The truth':`Bluffed by ${c.authors.map(escapeHtml).join(', ')||'—'}`} · ${c.voteNames.length} vote${c.voteNames.length===1?'':'s'}${c.voteNames.length?`: ${c.voteNames.map(escapeHtml).join(', ')}`:''}</div></div>`).join('');
    const scored=[...state.players].sort((a,b)=>b.score-a.score); screen.innerHTML=`<div class="phase-meta"><span>ROUND ${state.round} REVEAL</span><span class="timer">Next in ${state.nextIn}s</span></div><section class="card reveal"><div class="eyebrow">The real answer</div><h1 class="question" style="margin-bottom:12px">${escapeHtml(state.answer)}</h1><p class="hint" style="margin-top:0">${escapeHtml(state.question)}</p>${state.truthFoundNames.length?`<div class="truth-callout">Wrote the exact answer and earned 3: ${state.truthFoundNames.map(escapeHtml).join(', ')}</div>`:''}<div class="answers-grid">${answerCards}</div><h2 style="font-size:18px;margin:24px 0 8px">Leaderboard</h2><div class="board">${scored.map((p,i)=>`<div class="board-row"><span class="rank">${i+1}</span><strong>${escapeHtml(p.name)}</strong><span class="score">${p.score}</span></div>`).join('')}</div><div class="actions">${state.isHost?'<button id="next" class="btn">Next round →</button>':'<span class="hint">Next round starts automatically in 15 seconds.</span>'}</div></section>`; const next=$('#next');if(next)next.onclick=()=>send({type:'next'}); }
  function renderFinished() { const sorted=[...state.players].sort((a,b)=>b.score-a.score), top=sorted[0]?.score; screen.innerHTML=`<section class="card center"><div class="eyebrow">Game complete</div><h1 class="title">That’s the<br>final answer.</h1><p class="sub">Five rounds of truth, lies, and excellent bluffing.</p><div class="board" style="text-align:left">${sorted.map((p,i)=>`<div class="board-row"><span class="rank">${p.score===top?'★':i+1}</span><strong>${escapeHtml(p.name)}${p.score===top?' · WINNER':''}</strong><span class="score">${p.score}</span></div>`).join('')}</div><p class="fine">Create a new room to play again.</p><button id="home" class="btn secondary">Back to home</button></section>`; $('#home').onclick=()=>{send({type:'leave'});localStorage.removeItem('fof-player');stored.roomCode=null;stored.token=null;state=null;renderJoin();}; }
  function render() { if(!state)return; if(state.phase==='lobby')renderLobby(); else if(state.phase==='writing')renderWriting(); else if(state.phase==='voting')renderVoting(); else if(state.phase==='reveal')renderReveal(); else if(state.phase==='finished')renderFinished(); }
  setInterval(()=>{if(state?.endsAt&&['writing','voting'].includes(state.phase)){const timer=document.querySelector('.timer');if(timer){const s=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));timer.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}}if(state?.phase==='reveal'){const timer=document.querySelector('.timer');if(timer)timer.textContent=`Next in ${Math.max(0,Math.ceil((state.endsAt-Date.now())/1000))}s`; }},250);
  connect();
})();
</script>
</body>
</html>
